<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="/" aria-label="UNIMIK s.r.o. – úvodní stránka">{{include:logo-inline}}</a>
    <nav class="main-nav" aria-label="Hlavní navigace">
      <ul>{{nav}}</ul>
    </nav>
    <div class="header-actions">
      <a class="hbtn hbtn--ink" href="{{tel0}}">
        <span class="hbtn-label">Poptávka</span>
        <span class="hbtn-num">{{icon:phone}}{{phone0short}}</span>
      </a>
      <a class="hbtn hbtn--alert" href="{{emergencyTel}}">
        <span class="hbtn-label">Havárie non-stop</span>
        <span class="hbtn-num">{{icon:siren}}{{emergencyShort}}</span>
      </a>
    </div>
  </div>
</header>
